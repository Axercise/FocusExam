<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Timer</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@200;300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#101214;--sf:#181b1e;--ln:#272b30;--tx:#e6e8e9;--mu:#78818a;--ac:#8fb5a6;--dg:#c48a8a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:300 15px/1.5 'Prompt','Noto Sans Thai',system-ui,sans-serif}
body.brk{--ac:#c3a77f}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:16px}
#sub{font-size:20px;font-weight:300;letter-spacing:.02em;text-align:center;max-width:90vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{position:relative;width:min(78vw,300px);aspect-ratio:1}
.ring svg{width:100%;height:100%}
#tm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(34px,10vw,46px);font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:.03em}
#fg{transition:stroke .6s}
.bt{display:flex;gap:12px}
.b{padding:10px 30px;border-radius:999px;border:1px solid var(--ln);min-width:104px;transition:background .2s,border-color .2s}
.b:hover{border-color:var(--mu)}
.b.p{background:var(--ac);border-color:var(--ac);color:#101214;font-weight:400}
.b:disabled{opacity:.35;cursor:default}
#fin{color:var(--mu);font-size:13px;min-height:20px;text-decoration:underline;text-underline-offset:4px}
#fin[hidden]{display:block;visibility:hidden}
.cn{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));padding:8px 16px;border-radius:999px;color:var(--mu);font-size:14px}
.cn:hover{color:var(--tx)}
#bE{left:16px}#bL{right:16px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.ov.on{display:flex}
.cd{background:var(--sf);border:1px solid var(--ln);border-radius:16px;width:min(480px,100%);max-height:86vh;overflow:auto;padding:22px}
.cd h2{font-size:17px;font-weight:400;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.x{color:var(--mu);font-size:20px;line-height:1;padding:2px 8px}
.r{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.r input[type=radio]{accent-color:var(--ac);width:16px;height:16px;flex:none}
input[type=text],input[type=number],textarea{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:7px 9px;min-width:0}
.nm{flex:1}.n{width:48px;text-align:center}
.hd{display:flex;justify-content:flex-end;gap:6px;color:var(--mu);font-size:12px;padding-right:34px;margin-bottom:4px}
.hd span{width:48px;text-align:center}
.dl{color:var(--dg);padding:4px 8px;flex:none}
.sec{border-top:1px solid var(--ln);margin-top:14px;padding-top:14px;display:flex;gap:8px;align-items:center}
.sec label{color:var(--mu);flex:1}
.sm{padding:7px 16px;border:1px solid var(--ln);border-radius:8px}
.sm:hover{border-color:var(--ac)}
textarea{width:100%;min-height:96px;resize:vertical;margin:4px 0 12px}
.ft{display:flex;gap:8px;justify-content:flex-end}
.sum{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:14px}
.sum .t{flex:0 0 38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{flex:1;height:4px;background:var(--ln);border-radius:4px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:4px}
.sum .d{color:var(--mu);font-size:13px;min-width:78px;text-align:right}
.en{border-top:1px solid var(--ln);padding:12px 0 2px}
.en .m{display:flex;justify-content:space-between;color:var(--mu);font-size:12.5px;margin-bottom:6px}
.en textarea{min-height:56px;margin:0;font-size:14px}
.em{color:var(--mu);text-align:center;padding:14px 0}
#oA .cd{text-align:center;padding:32px 22px;width:min(340px,100%)}
#oA p{color:var(--mu);margin:6px 0 24px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div id="sub"></div>
  <div class="ring">
    <svg viewBox="0 0 300 300"><circle cx="150" cy="150" r="136" fill="none" stroke="var(--ln)" stroke-width="5"/><circle id="fg" cx="150" cy="150" r="136" fill="none" stroke="var(--ac)" stroke-width="5" stroke-linecap="round" transform="rotate(-90 150 150)"/></svg>
    <div id="tm">00:00:00</div>
  </div>
  <div class="bt"><button class="b p" id="bS">Start</button><button class="b" id="bP">Stop</button></div>
  <button id="fin" hidden></button>
</div>
<button class="cn" id="bE">Edit</button>
<button class="cn" id="bL">บันทึกการอ่าน</button>

<div class="ov" id="oE"><div class="cd">
  <h2>จัดการวิชา <button class="x" data-c="oE" aria-label="ปิด">×</button></h2>
  <div class="hd"><span>ชม.</span><span>นาที</span><span>วินาที</span></div>
  <div id="eb"></div>
  <div class="r" style="margin-top:12px"><input type="text" class="nm" id="nn" placeholder="ชื่อวิชาใหม่"><button class="sm" id="na">เพิ่มวิชา</button></div>
  <div class="sec"><label for="bk">เวลาพักต่อรอบ (นาที)</label><input type="number" class="n" id="bk" min="0" max="120"></div>
</div></div>

<div class="ov" id="oA"><div class="cd"><h2 id="at" style="justify-content:center;font-size:20px;margin:0"></h2><p id="ap"></p><button class="b p" id="aok">หยุดแจ้งเตือน</button></div></div>

<div class="ov" id="oN"><div class="cd">
  <h2 id="nh">บันทึกการเรียนรู้</h2>
  <p style="color:var(--mu);font-size:14px" id="ns"></p>
  <textarea id="nt" placeholder="รอบนี้ได้เรียนรู้อะไรบ้าง"></textarea>
  <div class="ft"><button class="sm" id="nk">ข้าม</button><button class="b p" style="min-width:0;padding:7px 22px" id="ny">บันทึก</button></div>
</div></div>

<div class="ov" id="oL"><div class="cd">
  <h2>บันทึกการอ่าน <button class="x" data-c="oL" aria-label="ปิด">×</button></h2>
  <div id="lb"></div>
</div></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const p2=n=>String(n).padStart(2,'0');
let S={subs:[],sel:null,brk:5,logs:[]};
try{const d=JSON.parse(localStorage.getItem('studytimer1'));if(d&&d.subs)S=d}catch(e){}
const save=()=>{try{localStorage.setItem('studytimer1',JSON.stringify(S))}catch(e){}};
if(!S.subs.length&&!S.logs.length){S.subs=[{id:uid(),name:'วิชาตัวอย่าง',h:1,m:0,s:0}];S.sel=S.subs[0].id}
const T={total:0,left:0,run:false,end:0,mode:'study'};
const C=2*Math.PI*136;
const cur=()=>S.subs.find(x=>x.id===S.sel);
const elapsed=()=>Math.round((T.total-T.left)/1000);

function load(){
  T.mode='study';document.body.classList.remove('brk');
  const c=cur();T.total=T.left=c?(c.h*3600+c.m*60+c.s)*1000:0;T.run=false;draw();
}
function draw(){
  const sec=Math.ceil(T.left/1000);
  const t=`${p2(Math.floor(sec/3600))}:${p2(Math.floor(sec%3600/60))}:${p2(sec%60)}`;
  $('#tm').textContent=t;
  const f=T.total?T.left/T.total:0;
  $('#fg').setAttribute('stroke-dasharray',C);
  $('#fg').setAttribute('stroke-dashoffset',C*(1-f));
  const c=cur();
  $('#sub').textContent=T.mode==='break'?'พักสักครู่':(c?c.name:'เพิ่มวิชาที่ปุ่ม Edit');
  $('#bS').disabled=!T.total;$('#bP').disabled=!T.run;
  $('#bS').textContent=T.run?'Running':(elapsed()>0?'Resume':'Start');
  const fin=$('#fin');
  if(!T.run&&T.mode==='break'){fin.hidden=false;fin.textContent='ข้ามเวลาพัก'}
  else if(!T.run&&T.mode==='study'&&elapsed()>0){fin.hidden=false;fin.textContent='จบรอบนี้และบันทึก'}
  else fin.hidden=true;
  document.title=T.run?`${t} · Study Timer`:'Study Timer';
}
let AC=null,alarm=null;
function ctx(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function beep(){
  const a=ctx();if(!a)return;
  [0,.3].forEach(d=>{const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+d;o.connect(g);g.connect(a.destination);o.frequency.value=d?784:660;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.25)});
  try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}
}
function startAlarm(){
  stopAlarm();beep();alarm=setInterval(beep,1400);
  const brk=T.mode==='break';
  $('#at').textContent=brk?'หมดเวลาพักแล้ว':'หมดเวลาอ่านแล้ว';
  $('#ap').textContent=brk?'พร้อมกลับไปอ่านต่อ':(cur()?cur().name:'');
  $('#oA').classList.add('on');document.title='⏰ หมดเวลา!';
  setTimeout(()=>$('#aok').focus(),50);
}
function stopAlarm(){clearInterval(alarm);alarm=null;$('#oA').classList.remove('on')}
function start(){if(!T.total||T.run)return;ctx();if(T.left<=0)T.left=T.total;T.run=true;T.end=Date.now()+T.left;draw()}
function stop(){if(!T.run)return;T.left=Math.max(0,T.end-Date.now());T.run=false;draw()}
setInterval(()=>{if(!T.run)return;T.left=Math.max(0,T.end-Date.now());draw();if(T.left<=0)done()},250);

let pend=null;
function done(){T.run=false;draw();startAlarm()}
$('#aok').onclick=()=>{
  stopAlarm();draw();
  if(T.mode==='break'){load();return}
  openNote(Math.round(T.total/1000),true);
};
function openNote(secs,withBreak){
  const c=cur();pend={secs,name:c?c.name:'-',sid:S.sel,withBreak};
  $('#ns').textContent=`${pend.name} · ${dur(secs)}`;$('#nt').value='';
  $('#oN').classList.add('on');setTimeout(()=>$('#nt').focus(),50);
}
function closeNote(saveIt){
  if(!pend)return;
  addLog(pend.secs,saveIt?$('#nt').value.trim():'',pend);
  $('#oN').classList.remove('on');
  const wb=pend.withBreak;pend=null;
  if(wb&&S.brk>0){
    T.mode='break';document.body.classList.add('brk');T.total=T.left=S.brk*60000;T.run=true;T.end=Date.now()+T.left;draw();
  }else load();
}
function addLog(secs,note,p){
  if(secs<1)return;
  S.logs.unshift({id:uid(),sid:p.sid,name:p.name,secs,note,ts:Date.now()});save();
}
$('#ny').onclick=()=>closeNote(true);
$('#nk').onclick=()=>closeNote(false);
$('#bS').onclick=start;$('#bP').onclick=stop;
$('#fin').onclick=()=>{
  if(T.mode==='break'){load();return}
  openNote(elapsed(),false);
};

function dur(s){
  if(s<60)return s+' วิ';
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60);
  return (h?h+' ชม. ':'')+m+' น.';
}

/* Edit */
function rEdit(){
  $('#eb').innerHTML=S.subs.length?S.subs.map(x=>`<div class="r">
    <input type="radio" name="pk" title="เลือกวิชานี้" ${x.id===S.sel?'checked':''} onchange="pick('${x.id}')">
    <input type="text" class="nm" value="${esc(x.name)}" onchange="upd('${x.id}','name',this.value)">
    <input type="number" class="n" min="0" value="${x.h}" onchange="upd('${x.id}','h',this.value)">
    <input type="number" class="n" min="0" max="59" value="${x.m}" onchange="upd('${x.id}','m',this.value)">
    <input type="number" class="n" min="0" max="59" value="${x.s}" onchange="upd('${x.id}','s',this.value)">
    <button class="dl" title="ลบวิชา" onclick="del('${x.id}')">×</button></div>`).join(''):'<div class="em">ยังไม่มีวิชา เพิ่มวิชาแรกด้านล่าง</div>';
  $('#bk').value=S.brk;
}
function pick(id){
  stop();
  if(T.mode==='study'&&elapsed()>0)addLog(elapsed(),'',{sid:S.sel,name:cur()?cur().name:'-'});
  S.sel=id;save();load();
}
function upd(id,k,v){
  const x=S.subs.find(a=>a.id===id);if(!x)return;
  if(k==='name')x.name=v.trim()||'ไม่มีชื่อ';
  else{v=Math.max(0,parseInt(v)||0);x[k]=k==='h'?v:Math.min(59,v)}
  save();
  if(id===S.sel&&!T.run&&T.mode==='study'&&T.left===T.total)load();else draw();
  rEdit();
}
function del(id){
  const was=id===S.sel;
  S.subs=S.subs.filter(a=>a.id!==id);
  if(was){stop();S.sel=S.subs[0]?S.subs[0].id:null;load()}
  save();rEdit();
}
$('#na').onclick=()=>{
  const n=$('#nn').value.trim();if(!n)return;
  const x={id:uid(),name:n,h:1,m:0,s:0};S.subs.push(x);
  if(!S.sel){S.sel=x.id;load()}
  $('#nn').value='';save();rEdit();
};
$('#nn').onkeydown=e=>{if(e.key==='Enter')$('#na').click()};
$('#bk').onchange=e=>{S.brk=Math.min(120,Math.max(0,parseInt(e.target.value)||0));save();rEdit()};
$('#bE').onclick=()=>{rEdit();$('#oE').classList.add('on')};

/* Log */
function rLog(){
  if(!S.logs.length){$('#lb').innerHTML='<div class="em">ยังไม่มีบันทึก จับเวลาอ่านให้ครบรอบแรกได้เลย</div>';return}
  const g={};S.logs.forEach(l=>g[l.name]=(g[l.name]||0)+l.secs);
  const tot=S.logs.reduce((a,l)=>a+l.secs,0),mx=Math.max(...Object.values(g));
  $('#lb').innerHTML=`<p style="color:var(--mu);margin-bottom:12px">รวมทั้งหมด ${dur(tot)}</p>`+
   Object.entries(g).sort((a,b)=>b[1]-a[1]).map(([n,s])=>`<div class="sum"><span class="t">${esc(n)}</span><span class="bar"><i style="width:${s/mx*100}%"></i></span><span class="d">${dur(s)}</span></div>`).join('')+
   `<div style="margin-top:16px">`+S.logs.map(l=>`<div class="en"><div class="m"><span>${esc(l.name)} · ${dur(l.secs)}</span><span>${new Date(l.ts).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})} <button class="dl" title="ลบ" onclick="dl('${l.id}')">×</button></span></div><textarea placeholder="เพิ่มโน้ตว่าได้เรียนรู้อะไร" onchange="nt('${l.id}',this.value)">${esc(l.note)}</textarea></div>`).join('')+`</div>`;
}
function nt(id,v){const l=S.logs.find(a=>a.id===id);if(l){l.note=v.trim();save()}}
function dl(id){S.logs=S.logs.filter(a=>a.id!==id);save();rLog()}
$('#bL').onclick=()=>{rLog();$('#oL').classList.add('on')};

document.querySelectorAll('.x').forEach(b=>b.onclick=()=>$('#'+b.dataset.c).classList.remove('on'));
['oE','oL'].forEach(i=>$('#'+i).addEventListener('click',e=>{if(e.target.id===i)e.target.classList.remove('on')}));
load();
</script>
</body>
</html>
